# Exposed ports:
#   web: 3000
#   api: 8000
#   postgres: 5432
#   minio api: 9000
#   minio console: 9001
#
# Environment: DB_URL, S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qao-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qao_inmate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: qao-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: qao-api
    environment:
      DB_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/qao_inmate
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      CORS_ORIGINS: '["http://localhost:3000","http://web:3000","http://127.0.0.1:3000"]'
      # Unset by default -> mock AI mode. Set OPENAI_API_KEY in your shell/.env
      # before `docker compose up` to switch the RAG pillar to real OpenAI calls.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: qao-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server-side-only: used by Next.js Route Handlers (apiProxy, /api/login)
      # running inside this container, where "localhost:8000" doesn't reach
      # the api container. NEXT_PUBLIC_API_URL stays host-facing for the browser.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
